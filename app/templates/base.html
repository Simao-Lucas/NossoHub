<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ app_name }}</title>
    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
    <meta name="theme-color" content="#12081f">
    <link rel="preconnect" href="https://fonts.bunny.net">
    <link href="https://fonts.bunny.net/css?family=fraunces:500,600,700|sora:400,500,600,700" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
    {% if not hide_navbar %}
        {% include "partials/navbar.html" %}
    {% endif %}

    <main class="nh-container {% if hide_navbar %}nh-main-home{% else %}nh-main{% endif %}">
        {% for flash in flashes %}
            <div class="nh-flash nh-flash-{{ flash.category }}">{{ flash.message }}</div>
        {% endfor %}
        {% block content %}{% endblock %}
    </main>
    {% block scripts %}{% endblock %}
</body>
</html>
