services:
  mariadb:
    image: mariadb:11.4
    container_name: nosso_hub_mariadb
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-nosso_hub}
      MYSQL_USER: ${DB_USERNAME:-nosso_hub}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootsecret}
      MARIADB_AUTO_UPGRADE: "1"
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./docker/ensure_schema.sql:/docker-entrypoint-initdb.d/01-ensure_schema.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks:
      - nosso_hub
      - homelab

  web:
    build: .
    image: nosso_hub_web:python
    container_name: nosso_hub_web
    restart: unless-stopped
    ports:
      - "2807:8000"
    env_file:
      - .env
    environment:
      DB_HOST: mariadb
      DB_PORT: "3306"
      DB_DATABASE: ${DB_DATABASE:-nosso_hub}
      DB_USERNAME: ${DB_USERNAME:-nosso_hub}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      APP_URL: ${APP_URL:-http://localhost:2807}
      MEDIA_ROOT: /app/media
    volumes:
      - ./media:/app/media
    depends_on:
      mariadb:
        condition: service_healthy
    networks:
      - nosso_hub
      - homelab

networks:
  nosso_hub:
    driver: bridge
    name: nosso_hub_net
  homelab:
    external: true

volumes:
  mariadb_data:
    name: nosso_hub_mariadb_data
